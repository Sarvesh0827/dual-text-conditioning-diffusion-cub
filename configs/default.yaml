seed: 0
image_size: 256
latent_channels: 4
latent_size: 64
timesteps: 1000
schedule: cosine

batch_size: 8
grad_accum: 8          # effective batch 64; change after scripts/bench_4090.py
lr: 1.0e-4
weight_decay: 0.0
ema_decay: 0.9999
precision: amp_fp16
num_workers: 4
save_every: 5000
sample_every: 5000
log_every: 100
max_steps: 200000      # estimate only; set after 4090 benchmark
grad_checkpoint: false

clip_model: openai/clip-vit-base-patch32
p_uncond: 0.10
guidance_w: 3.0
ddim_steps: 50
ddim_eta: 0.0

use_global_text: true
use_local_text: true
use_part_loss: false

bbox_expand: 1.1
num_captions: 10
text_max_length: 77
